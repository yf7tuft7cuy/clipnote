</head><body>
<style>
/* Layout: phone-first single column notebook. Sticky search header, folder chip rail, card list, floating add button, full-screen editor. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#E1E8E3; --fg:#17201B; --muted:#56645D; --line:#D0D9D3;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#D4E9E3; --mark:#F2CF5B; --danger:#B3261E;
  --b-img:#2F6FB5; --b-vid:#8A4FB0; --b-sns:#C2410C; --b-web:#56645D;
  --font-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A211D; --sunk:#232C27; --fg:#E4EBE7; --muted:#9AA9A1; --line:#2E3933;
  --accent:#3DB79C; --accent-ink:#0B1411; --accent-soft:#1F3A32; --mark:#E2C04E; --danger:#F2867E;
  --b-img:#7FB0EA; --b-vid:#C49BE0; --b-sns:#F49A6A; --b-web:#9AA9A1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A211D; --sunk:#232C27; --fg:#E4EBE7; --muted:#9AA9A1; --line:#2E3933;
  --accent:#3DB79C; --accent-ink:#0B1411; --accent-soft:#1F3A32; --mark:#E2C04E; --danger:#F2867E;
  --b-img:#7FB0EA; --b-vid:#C49BE0; --b-sns:#F49A6A; --b-web:#9AA9A1; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
